[sgs_option]
sgs_fofn = /work1/sponge/lht_reassembly_compare/06_flye_sub118_nextpolish/sgs.fofn
sgs_options = -max_depth 100 -bwa

[lgs_option]
lgs_fofn = /work1/sponge/lht_reassembly_compare/06_flye_sub118_nextpolish/lgs.fofn
lgs_options = -min_read_len 1k -max_depth 100
