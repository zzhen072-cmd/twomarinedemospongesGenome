[General]
job_type = local
job_prefix = lht_flye118_np
task = best
rewrite = yes
deltmp = no
rerun = 3
parallel_jobs = 1
multithread_jobs = 30
genome = /work1/sponge/lht_reassembly_compare/03_assemblies/flye_sub118/assembly.fasta
