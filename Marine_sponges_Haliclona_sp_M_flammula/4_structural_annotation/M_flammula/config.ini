[paths]
samples_file = /work1/sponge/lht-njlan-final-annotation-20261007/njlan/03_braker4/samples.csv
augustus_config_path = /work1/sponge/lht-njlan-final-annotation-20261007/njlan/03_braker4/augustus_config
busco_download_path = /work1/sponge/genome_annotation/braker4_shared/busco_downloads
compleasm_download_path = /work1/sponge/genome_annotation/braker4_shared/compleasm_downloads

[containers]
